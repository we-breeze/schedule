[package]
name = "brz-schedule-redis"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Atomic Redis job and lock providers for brz-schedule"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/schedule"

[dependencies]
async-trait = "0.1"
brz-schedule = { path = "../..", version = "=0.0.1" }
brz-redis = "=0.0.16"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
brz-schedule = { path = "../..", version = "=0.0.1", features = ["test-support"] }

[features]
default = []
integration-tests = []

[lints.rust]
unsafe_code = "forbid"
