[package]
name = "brz-schedule"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Provider-independent durable job execution and periodic scheduling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/schedule"

[workspace]
members = ["providers/redis"]
resolver = "3"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
croner = "=4.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[features]
default = []
test-support = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
