name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --locked --all-features
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked --features test-support
      - run: cargo test --workspace --locked --no-default-features
      - run: cargo test -p brz-schedule-redis --locked --features integration-tests
        env:
          BRZ_SCHEDULE_TEST_REDIS: 127.0.0.1:6379:0
      - run: cargo test --workspace --locked --release --features test-support
